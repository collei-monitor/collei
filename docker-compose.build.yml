# 开发者本地构建
# 用法: docker compose -f docker-compose.build.yml up -d --build

services:
  collei:
    image: collei:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_VERSION: ${FRONTEND_VERSION:-latest}
    ports:
      - "${COLLEI_PORT:-22333}:22333"
    volumes:
      - collei-data:/data
    environment:
      - COLLEI_DATABASE_URL=sqlite+aiosqlite:////data/collei.db
      - COLLEI_DATA_DIR=/data
      # - COLLEI_SECRET_KEY=
      # - COLLEI_CA_MASTER_KEY=
      # - COLLEI_DEFAULT_ADMIN_USERNAME=admin
      # - COLLEI_DEFAULT_ADMIN_PASSWORD=
      # - COLLEI_DEBUG=false
      # - COLLEI_APP_NAME=Collei
    # ── 安全加固 ──────────────────────────────────────────
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    restart: unless-stopped

volumes:
  collei-data:
