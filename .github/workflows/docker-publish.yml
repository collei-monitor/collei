name: Build & Publish Docker Image

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
    inputs:
      frontend_version:
        description: "Frontend version (e.g. v0.1.0). Leave empty to match backend tag."
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine frontend version
        id: frontend
        run: |
          if [ -n "${{ inputs.frontend_version }}" ]; then
            echo "version=${{ inputs.frontend_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRONTEND_VERSION=${{ steps.frontend.outputs.version }}
            COMMIT_HASH=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          CURRENT_TAG=${GITHUB_REF_NAME}
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          echo "Previous tag: ${PREVIOUS_TAG}"

          if [ -z "${PREVIOUS_TAG}" ]; then
            LOG=$(git log --pretty=format:"* %s (%h)" HEAD)
          else
            LOG=$(git log --pretty=format:"* %s (%h)" ${PREVIOUS_TAG}..${CURRENT_TAG})
          fi

          {
            echo "## What's Changed"
            echo ""
            echo "${LOG}"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
          } > CHANGELOG.md

          cat CHANGELOG.md

      - name: Package source
        run: |
          tar --exclude='.git' -czf /tmp/collei-server-${{ github.ref_name }}.tar.gz .
          zip -r /tmp/collei-server-${{ github.ref_name }}.zip . -x '.git/*'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/collei-server-${{ github.ref_name }}.tar.gz
            /tmp/collei-server-${{ github.ref_name }}.zip
          body_path: CHANGELOG.md
